name: v2 CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2/api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: v2/api/go.mod
          cache-dependency-path: v2/api/go.sum
      - name: Format
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Vet
        run: go vet ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          working-directory: v2/api
      - name: Test
        run: go test -race ./...
      - uses: sqlc-dev/setup-sqlc@v5
        with:
          sqlc-version: "1.25.0"
      - name: Generated code is up to date
        run: sqlc diff
      - name: Build
        run: go build ./...

  migrations:
    name: Migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
    defaults:
      run:
        working-directory: v2/api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: v2/api/go.mod
          cache-dependency-path: v2/api/go.sum
      - name: Stub Supabase auth schema and roles
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          create role anon nologin;
          create role authenticated nologin;
          create role service_role nologin;
          create schema auth;
          create table auth.users (id uuid primary key default gen_random_uuid());
          create function auth.uid() returns uuid language sql stable as $$
            select nullif(current_setting('request.jwt.claim.sub', true), '')::uuid
          $$;
          SQL
      - name: Up
        run: go run ./cmd/migrate up
      - name: Down to zero and back up
        run: |
          for _ in $(ls migrations/*.sql); do go run ./cmd/migrate down; done
          go run ./cmd/migrate up
          go run ./cmd/migrate status

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2/web
    env:
      VITE_SUPABASE_URL: https://ci.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
      VITE_API_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: v2/web/package-lock.json
      - run: npm ci
      - name: Format
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Audit
        run: npm audit --audit-level=high

  ci-passed:
    name: v2 CI passed
    if: always()
    needs: [api, migrations, web]
    runs-on: ubuntu-latest
    steps:
      - name: Require all jobs to succeed
        run: |
          [ "${{ needs.api.result }}" = success ] &&
          [ "${{ needs.migrations.result }}" = success ] &&
          [ "${{ needs.web.result }}" = success ]
