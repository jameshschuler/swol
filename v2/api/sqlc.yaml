version: "2"
sql:
  - engine: postgresql
    schema: migrations
    queries: internal/db/queries
    gen:
      go:
        package: db
        out: internal/db
        sql_package: pgx/v5
        emit_json_tags: true
        emit_interface: true
        json_tags_case_style: camel
        emit_pointers_for_null_types: true
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              import: time
              type: Time
              pointer: true
          - db_type: pg_catalog.numeric
            go_type: float64
          - db_type: pg_catalog.numeric
            nullable: true
            go_type:
              type: float64
              pointer: true
        rename:
          swol_user_setting: UserSettings
          swol_exercise: Exercise
          swol_workout_session: WorkoutSession
          swol_session_note: SessionNote
          swol_milestone: Milestone
          swol_goal: Goal
          swol_user_achievement: UserAchievement
          swol_weight_unit: WeightUnit
          swol_session_status: SessionStatus
          swol_weight_unit_lb: WeightUnitLb
          swol_weight_unit_kg: WeightUnitKg
          swol_session_status_active: SessionStatusActive
          swol_session_status_paused: SessionStatusPaused
          swol_session_status_completed: SessionStatusCompleted
